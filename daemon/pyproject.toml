[project]
name = "ami"
version = "0.1.0"
description = "ami daemon: the brain of the anti-doomscroll desktop companion"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9,<4",
    "pyyaml>=6,<7",
]

[project.scripts]
ami = "ami.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
